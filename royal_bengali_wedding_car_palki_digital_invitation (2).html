    <script>

            theme: {
                extend: {
                    fontFamily: {

    <style>
        body {
            font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
            background-color: #FDF8F2;
            overflow-x: hidden;
        }

        /* Traditional Bengali Folk-Art Decorative Border */
        .folk-royal-frame {
            background: #FFFDF7;
            border: 8px solid transparent;
            border-image: repeating-linear-gradient(
                45deg,
                #8B1538 0px,
                #8B1538 14px,
                #F59E0B 14px,
                #F59E0B 28px,
                #0D5C46 28px,
                #0D5C46 42px,
                #0D9488 42px,
                #0D9488 56px
            ) 12;
            box-shadow: 0 22px 45px -12px rgba(139, 21, 56, 0.22);
        }

        /* Scalloped Arch Card Border */
        .scalloped-card {
            background: #FFFDF7;
            border: 3px solid #8B1538;
            box-shadow: 0 12px 30px -8px rgba(139, 21, 56, 0.15);
            position: relative;
        }
        .scalloped-card::after {
            content: "";
            position: absolute;
            inset: 5px;
            border: 1.5px dashed #F59E0B;
            border-radius: inherit;
            pointer-events: none;
        }

        /* Festive Road for Wedding Car */
        .wedding-road {
            background: linear-gradient(180deg, #2D333B 0%, #1F242B 100%);
            border-top: 5px solid #F59E0B;
            border-bottom: 5px solid #0D5C46;
            position: relative;
            height: 92px;
            box-shadow: inset 0 6px 14px rgba(0,0,0,0.4);
        }
        .wedding-road::after {
            content: "";
            position: absolute;
            top: 62%;
            left: 0;
            right: 0;
            height: 4px;
            transform: translateY(-50%);
            background-image: linear-gradient(to right, #FDE68A 55%, transparent 55%);
            background-size: 40px 4px;
        }

        /* Gentle Palki Sway & Car Engine Hum Animations */
        @keyframes palkiSway {
            0%, 100% { transform: rotate(-1.5deg) translateY(0px); }
            50% { transform: rotate(1.5deg) translateY(-4px); }
        }
        .animate-palki {
            animation: palkiSway 2.4s ease-in-out infinite;
            transform-origin: top center;
        }

        @keyframes carHum {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-2px); }
        }
        .animate-car {
            animation: carHum 0.45s ease-in-out infinite;
        }

        @keyframes wheelSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .wheel-spin {
            transform-origin: center;
            animation: wheelSpin 2.5s linear infinite;
        }

        /* Floating Marigold & Rose Petals */
        @keyframes floatPetal {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 0; }
            20% { opacity: 0.9; }
            80% { opacity: 0.9; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
        .petal {
            position: fixed;
            top: -20px;
            z-index: 40;
            pointer-events: none;
            animation: floatPetal linear infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.45; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.18); }
        }
        .fairy-bulb {
            animation: pulseGlow 2s infinite ease-in-out;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #FDF8F2; }
        ::-webkit-scrollbar-thumb { background: #8B1538; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-turmericYellow selection:text-slate-900">

        // ===================================================================
        // LIVE COUNTDOWN ENGINE (Synced to WEDDING_CONFIG.countdownTargetISO)
        // ===================================================================
        function updateCountdown() {
            const targetTime = new Date(WEDDING_CONFIG.countdownTargetISO).getTime();
            const now = Date.now();
            const diff = targetTime - now;

            const liveBanner = document.getElementById('cd-live-status');
            if (diff <= 0) {
                document.getElementById('cd-days').textContent = currentLang === 'bn' ? '০০' : '00';
                document.getElementById('cd-hours').textContent = currentLang === 'bn' ? '০০' : '00';
                document.getElementById('cd-mins').textContent = currentLang === 'bn' ? '০০' : '00';
                document.getElementById('cd-secs').textContent = currentLang === 'bn' ? '০০' : '00';
                liveBanner.textContent = UI_TEXT[currentLang].eventArrived;
                liveBanner.classList.remove('hidden');
                return;
            }

            liveBanner.classList.add('hidden');
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            const fmt = (n) => {
                const s = String(n).padStart(2, '0');
                return currentLang === 'bn' ? toBengaliDigits(s) : s;
            };

            document.getElementById('cd-days').textContent = fmt(days);
            document.getElementById('cd-hours').textContent = fmt(hours);
            document.getElementById('cd-mins').textContent = fmt(minutes);
            document.getElementById('cd-secs').textContent = fmt(seconds);
        }

        // ===================================================================
        // DYNAMIC CALENDAR (.ICS) GENERATOR FROM WEDDING_CONFIG
        // ===================================================================
        function downloadEventICS(eventId) {
            const ev = WEDDING_CONFIG.events.find(e => e.id === eventId);
            if (!ev) return;

            const coupleStr = `${WEDDING_CONFIG.couple.groomShort.en} & ${WEDDING_CONFIG.couple.brideShort.en}`;
            const summary = `${coupleStr} - ${ev.title.en} (${ev.title.bn})`;
            const location = `${ev.venue.en}, ${ev.address.en}`;

            const ics = [
                "BEGIN:VCALENDAR",
                "VERSION:2.0",
                "PRODID:-//RoyalBengaliWedding//Invitation//EN",
                "BEGIN:VEVENT",
                `SUMMARY:${summary}`,
                `DTSTART;TZID=Asia/Dhaka:${ev.icsStart}`,
                `DTEND;TZID=Asia/Dhaka:${ev.icsEnd}`,
                `LOCATION:${location}`,
                `DESCRIPTION:${ev.subtitle.en} - ${WEDDING_CONFIG.couple.familiesHost.en}`,
                "END:VEVENT",
                "END:VCALENDAR"
            ].join("\r\n");

            const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `${WEDDING_CONFIG.couple.groomShort.en}-${WEDDING_CONFIG.couple.brideShort.en}-${ev.id}.ics`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            showToast(UI_TEXT[currentLang].toastCal);
        }

        // ===================================================================
        // SCROLL-LINKED WEDDING CAR & PALKI ANIMATION
        // ===================================================================
        function animateRoadVehicles() {
            const roads = document.querySelectorAll('.wedding-road');
            const winH = window.innerHeight;

            roads.forEach(road => {
                const rect = road.getBoundingClientRect();
                if (rect.top < winH && rect.bottom > 0) {
                    const progress = (winH - rect.top) / (winH + rect.height);
                    const vehicle = road.querySelector('.car-vehicle');
                    if (vehicle) {
                        const dir = vehicle.getAttribute('data-dir');
                        const maxTravel = Math.max(60, road.offsetWidth - 180);
                        const xPos = progress * maxTravel;
                        vehicle.style.transform = dir === 'right' ? `translateX(${xPos}px)` : `translateX(${-xPos}px)`;
                    }
                }
            });
        }

                petal.style.height = `${8 + Math.random() * 7}px`;
                petal.style.backgroundColor = colors[i % colors.length];
                petal.style.borderRadius = "60% 0 60% 0";
                petal.style.animationDuration = `${8 + Math.random() * 8}s`;
                petal.style.animationDelay = `${Math.random() * 6}s`;
                container.appendChild(petal);
            }
        }

        // ===================================================================
        // TOAST NOTIFICATION & SYNTHESIZED WEDDING MELODY
        // ===================================================================
        let toastTimer;
        function showToast(msg) {
            const box = document.getElementById('toast-box');
            document.getElementById('toast-message').textContent = msg;
            box.classList.remove('opacity-0', 'pointer-events-none');
            box.classList.add('opacity-100');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                box.classList.remove('opacity-100');
                box.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        let audioCtx = null;
        let isPlaying = false;
        let melodyTimer = null;
        const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 440.00, 392.00, 329.63, 293.66, 261.63];
        let noteIdx = 0;

        function playNote() {
            if (!isPlaying || !audioCtx) return;
            const now = audioCtx.currentTime;
            const freq = notes[noteIdx++ % notes.length];
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.exponentialRampToValueAtTime(0.07, now + 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.6);
        }

        function toggleMusic() {
            const iconMuted = document.getElementById('icon-muted');
            const iconPlaying = document.getElementById('icon-playing');
            if (!isPlaying) {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                isPlaying = true;
                iconMuted.classList.add('hidden');
                iconPlaying.classList.remove('hidden');
                playNote();
                melodyTimer = setInterval(playNote, 620);
                showToast(UI_TEXT[currentLang].toastMusicOn);
            } else {
                isPlaying = false;
                clearInterval(melodyTimer);
                iconPlaying.classList.add('hidden');
                iconMuted.classList.remove('hidden');
                showToast(UI_TEXT[currentLang].toastMusicOff);
            }
        }

        // Initialize on load
        window.addEventListener('scroll', animateRoadVehicles, { passive: true });
        window.addEventListener('resize', animateRoadVehicles);
        renderPageContent();
        loadWishes();
        spawnPetals();
        animateRoadVehicles();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
